<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content" />
    <title>Workflow</title>
    <style>
      html, body { margin: 0; padding: 0; background: #f9fafb; }
      .splash-init {
        display: flex; flex-direction: column; align-items: center;
        justify-content: center; height: 100vh; background: #f9fafb; gap: 16px;
      }
      .splash-init .dots { display: flex; gap: 6px; }
      .splash-init .dots span {
        width: 8px; height: 8px; border-radius: 50%; background: #9ca3af;
        animation: sp 1.2s ease-in-out infinite;
      }
      .splash-init .dots span:nth-child(2) { animation-delay: .15s; }
      .splash-init .dots span:nth-child(3) { animation-delay: .3s; }
      @keyframes sp {
        0%,80%,100% { opacity:.3; transform:scale(.8); }
        40% { opacity:1; transform:scale(1); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="splash-init">
        <div class="dots"><span></span><span></span><span></span></div>
      </div>
    </div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
