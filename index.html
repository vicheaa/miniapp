<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content" />
    <title>Workflow</title>
    <style>
      html, body { margin: 0; padding: 0; background: #f9fafb; }
      .splash-init {
        display: flex; flex-direction: column; align-items: center;
        justify-content: center; height: 100vh; background: #f9fafb; gap: 16px;
      }
      .splash-init .dots { display: flex; gap: 6px; }
      .splash-init .dots span {
        width: 8px; height: 8px; border-radius: 50%; background: #9ca3af;
        animation: sp 1.2s ease-in-out infinite;
      }
      .splash-init .dots span:nth-child(2) { animation-delay: .15s; }
      .splash-init .dots span:nth-child(3) { animation-delay: .3s; }
      @keyframes sp {
        0%,80%,100% { opacity:.3; transform:scale(.8); }
        40% { opacity:1; transform:scale(1); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="splash-init">
        <div class="dots"><span></span><span></span><span></span></div>
      </div>
    </div>
    <script>
      // This classic script can report startup failures even when the WebView
      // cannot parse the application's module bundle.
      (function () {
        var timer;
        function showStartupError(detail) {
          var splash = document.querySelector('.splash-init');
          if (!splash || splash.getAttribute('data-startup-error')) return;
          splash.setAttribute('data-startup-error', 'true');
          window.clearTimeout(timer);
          splash.textContent = '';
          splash.style.padding = '24px';
          splash.style.boxSizing = 'border-box';
          splash.style.textAlign = 'center';
          splash.style.fontFamily = 'sans-serif';
          var message = document.createElement('p');
          message.textContent = 'Unable to start Workflow. Please close the miniapp and try again.';
          splash.appendChild(message);
          if (detail) {
            var reason = document.createElement('p');
            reason.style.fontSize = '13px';
            reason.style.color = '#6b7280';
            reason.textContent = detail;
            splash.appendChild(reason);
          }
        }
        window.addEventListener('error', function (event) {
          showStartupError(event.message || 'An application file could not be loaded.');
        }, true);
        window.addEventListener('unhandledrejection', function () {
          showStartupError('The application failed to initialize.');
        });
        timer = window.setTimeout(function () {
          showStartupError('Startup timed out.');
        }, 20000);
      })();
    </script>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
