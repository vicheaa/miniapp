    reason: The user explicitly requested the four address divisions. The implementation reads components across reverse-geocoding results, prefers administrative levels over numbered sublocality levels, and leaves unavailable divisions blank rather than deriving them from formatted strings or nearby POIs. The names remain frontend draft metadata; order requests retain the existing formatted address contract.
    verification: On 2026-11-11, 14 maps/cart regression tests, typecheck, and the production build passed. Chromium against the existing Postman fixture verified all four names, confirmation and reopening, coordinate fallback with all previous divisions cleared after REQUEST_DENIED, stale-response/manual-edit handling, unchanged satellite and zoom controls, permission denial, and 280/390/768px layouts. Provider fixture names are synthetic and do not establish real Cambodian administrative boundaries. Live reverse geocoding remains denied by the existing key, as established by the earlier production check; enabling the Geocoding API and key authorization is still required for live automatic names. Google may omit smaller divisions, including villages. No live order was submitted.
