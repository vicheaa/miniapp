    verification: On 2026-11-12, all 16 focused maps/cart-storage tests, typecheck, and the Node 26.13.0 production build passed and miniapp.zip was regenerated. Headless Chrome exercised the running React app against this Postman simulation on port 4910 for OK and REQUEST_DENIED responses, all four administrative fields, empty address and disabled confirmation after denial, manual entry, coordinate-only entry rejection, typing during delayed lookup, changing the pin, saving and reopening. The simulation request log recorded SDK, geocode, and control traffic. A separate current live Google SDK lookup at the user's selected coordinates returned REQUEST_DENIED with no address or province; Geocoding API/project/key authorization remains an external configuration requirement. The fixture does not establish real boundary coverage or installed-device permissions.
