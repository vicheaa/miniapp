  - id: settled-map-geocoding
    status: supported
    claim: Against the local Maps stand-in, pin selection waits for map movement to settle and previous address lookups cannot overwrite a newer drag or a manual edit after a layout-only idle event.
    reason: Drag/pan intent gates selection, a short idle debounce coalesces callbacks, and drag start immediately invalidates the preceding lookup generation. Confirmation is disabled during movement and lookup.
    verification: On 2026-11-13, the real React picker ran against the existing Postman simulation on port 4910 using Node 26.13.0 and Chrome. A delayed lookup for A completed while B was being dragged and was ignored; repeated idle events selected only the final coordinates 11.63,104.93. The log recorded one lookup for A and one for final B. Header, map, details, and footer geometry remained unchanged through movement, resolution, and REQUEST_DENIED. A layout-only idle preserved manual text without another request; after a denied lookup, manual entry confirmed the final coordinates 11.64,104.94. No live provider or real order service was called. Existing local mocks were reused; owner discovery was not repeated.
    source: src/pages/cart/LocationPage.tsx; /private/tmp/miniapp-location-drag-check.mjs; postman/mocks/delivery-maps/default.js; /private/tmp/miniapp-location-drag-sim.ndjson request events dated 2026-11-13
