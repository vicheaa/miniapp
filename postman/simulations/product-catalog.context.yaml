purpose:
  stands_in_for: Central staff-order categories, products, order submission, employee order history, summary, media, and the Google Maps JavaScript/geocoding interface used by checkout.
  unblocks: Sales dashboard, catalog, and checkout date/location HTTP integration and mobile UI checks without credentials, Google charges, or real orders.
assumptions:
  - id: keyboard-bottom-action-opening-stability
    status: supported
    claim: View your Cart and Submit order hide before the first keyboard resize and remain hidden during software keyboard editing in the local iOS harness.
    reason: Input focus sets a separate synchronous action visibility state. Hidden actions have no exit transition, preventing a visible footer from moving with the shrinking viewport. Confirmed keyboard state holds them hidden until stable recovery, with a fade only on return. A 500ms provisional timeout preserves hardware keyboard use; Android Back re-taps are handled without requiring another focus event.
    verification: On 2026-11-13, 171 web tests, type checking, and production build passed. Both native XCTest scenarios passed with zero visible-action frames during editing, covering phone, repeated customer reopening, product quantity, search, and address. The fixture samples computed visibility on every animation frame, including the interval between focus and the keyboard detection threshold. These checks use a real iOS simulator keyboard with local catalog/map fixtures and do not establish physical-device animation quality. Bundle 0.1.11 contains this web fix; no further native host changes were made for it.
    source: src/utils/keyboardViewport.ts; src/styles/index.css; scripts/check-keyboard.test.js; scripts/check-webview-css.test.js; scripts/ios-keyboard/fixture.js; scripts/ios-keyboard/KeyboardTests.swift; /private/tmp/miniapp-ios-keyboard/footer-stability
    updated_at: '2026-11-13'
  - id: ios-keyboard-native-viewport
    status: supported
    claim: Against local catalog and map fixtures, the React input screens recover correctly from tapping inputs and opening or closing the native iOS keyboard in both overlay and resizing WKWebView hosts.
    reason: The iOS host preserves its native WebView frame and bottom safe area during keyboard animation. Unfocused iOS fields use trusted touch focus with preventScroll, while focused fields retain native selection. Geometry writes are deduplicated, footers fade without reflow, and settled field reveal moves only the form scroll container. Stable closing accepts safe-area changes and ends stale iOS editing sessions.
    verification: On 2026-11-13, two XCTest scenarios passed on the iPhone 17 simulator running iOS 26.5 with a real WKWebView and real software keyboard. Each scenario exercised phone entry, three customer-name reopen cycles, quantity entry, search entry, and address entry. Checks covered physical input bounds above the keyboard, a stable page top, hidden/restored actions, zero document scroll after closing, full recovered viewport height, and retained text. The native harness used the local fixture in scripts/ios-keyboard/fixture.js rather than the Postman HTTP Maps fixture; this does not establish behavior on physical iPhones or the deployed Flutter app. Final validation passed both native XCTest scenarios, 168 web tests including the WebView 101 CSS fallback, type checking, production build, 10 focused Flutter host tests, and analysis of both changed Flutter files. Full decoding of the original iOS recording found 34 frames with a missing header during four keyboard transitions; the final layout recording found zero missing-header frames across 502 frames covering the corresponding checkout cycles. Version 0.1.10 is prepared; applying the iOS host policy also requires a hot restart or rebuilt installed native app.
    source: src/utils/keyboardViewport.ts; src/hooks/useKeyboardViewport.ts; scripts/check-keyboard.test.js; scripts/ios-keyboard/KeyboardTests.swift; scripts/ios-keyboard/Host.swift; ../oml-central/lib/features/webview/presentation/super_app_webview.dart; ../oml-central/test/features/webview/super_app_webview_refresh_test.dart; /private/tmp/miniapp-ios-keyboard/final-smooth; /private/tmp/miniapp-ios-keyboard/final-layer-frames.json
